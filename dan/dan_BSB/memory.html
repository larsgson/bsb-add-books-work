, the right one);<\/li><li>a curation step turns each new item into entries of the project's store and writes on the status line what it did (<code>entered: …<\/code>, or <code>question back: …<\/code> when something is unclear);<\/li><li>from then on every drafting agent sees your decision first, marked as binding, and no agent may change it. If you change your mind, add a new item: only the team changes its own decisions.<\/li><\/ul>\n<p>Your words stay as you wrote them; only the status lines are written by the curation step.<\/p>\n<h2>Requests from us<\/h2>\n<p>What would help the drafts most just now:<\/p>\n<ul><li><strong>Spelling and tone marks:<\/strong> examples of forms our drafts get wrong (chapter and verse, our form, your form). Each one becomes a rule every later chapter follows, and the drafting agents now check every word form against your published text, marks included.<\/li><li><strong>The numbered <a href=\"#spoergsmaal.md\">questions<\/a>:<\/strong> an answer to any of them, by number.<\/li><\/ul>\n<h2>Store entries<\/h2>\n<div class=\"store-block\"><div class=\"store-label\">Store entries (generated from profile/)<\/div>\n<p>_(no store entries on this page)_<\/p>\n<\/div>\n<h2>Items<\/h2>", "text": "# The team's input **For the Danish translation team.** Write here anything you want the drafts to get right: a word you use, a spelling, a name, a rule, a correction to a draft verse, an answer to one of the [questions](spoergsmaal.md). Plain sentences in Danish are enough; quotations in Danish as you write them. Nobody needs to touch the store files. How it works: - add an item at the end, as `### T<next number> · <date> · <your name or \"the team\">`, then a line `Status: new`, then your words (as long as you like; examples help: chapter and verse, the wrong form, the right one); - a curation step turns each new item into entries of the project's store and writes on the status line what it did (`entered: …`, or `question back: …` when something is omenet <em>ḥēræm<\/em> er stadig åbent (»det der er lagt band på« / »bandet«).<\/li><li><em>šôfār<\/em> = <strong>vædderhorn<\/strong> (DFB Dom 3,27; 6,34; 7).<\/li><li><em>ʕēdāh<\/em> = <strong>menighed<\/strong> i Josva i tre former: »israelitternes menighed« (Jos 22,12), »Israels menighed«, »HERRENS menighed« (22,16-17). DFB's 4 Mos har »forsamling«; ét valg for projektet udestår.<\/li><li><em>tôrāh<\/em> = <strong>lov<\/strong>, »Moses' lovbog«, »Guds lovbog« (Jos 1,7-8; 8,31-34; 24,26).<\/li><li><em>šᵊʔôl<\/em> = <strong>dødsriget<\/strong> (DFB 40×; udkastene 1 Mos 37,35; 42,38; 44,29.31).<\/li><li><em>ḥæsæd<\/em> = <strong>trofasthed<\/strong>; <em>ḥæsæd wæʔæmæt<\/em> = »trofasthed og troskab« (1 Mos 24,27), åbent for hele bogen.<\/li><\/ul>\n<h2>Josvabogen<\/h2>\n<ul><li><strong>stærk og modig<\/strong> (Jos 1,6.9.18; 1,7 »stærk og meget modig«); 23,6 kun »meget stærke«.<\/li><li><em>šōṭᵊrîm<\/em> = <strong>ledere<\/strong>; <em>hēnîaḥ<\/em> = <strong>give hvile<\/strong>; <strong>skøge<\/strong> (Rahab; DFB 16×); <strong>udspionere<\/strong> og <strong>spejdere<\/strong>; <em>māʕal<\/em> = <strong>handle troløst<\/strong> (7,1 og 22,20 ens).<\/li><li>Byretten fra 4 Mos 35: <strong>tilflugtsbyer<\/strong>, <strong>blodhævneren<\/strong>, »slår en person ihjel ved et uheld«; <em>migrāš<\/em> = »… med <strong>tilhørende marker<\/strong>«.<\/li><li>Landskaber: <strong>Araba<\/strong>, <strong>sydlandet<\/strong> (i opremsninger; ellers Negev), <strong>lavlandet<\/strong>, <strong>bjerglandet<\/strong>, <strong>Sivhavet<\/strong>, <strong>Det Store Hav<\/strong>, <strong>Salthavet<\/strong>. »Efraims bjergland« (udkast) mod DFB's »Efraims Bjerge« (Dom, 12×) er åbent.<\/li><li><em>hammîšōr<\/em> = »højsletten« og <em>missāvîv<\/em> = »til alle sider« har intet DFB-forbillede.<\/li><\/ul>\n<h2>1 Mosebog 20-50<\/h2>\n<ul><li><em>šifḥāh<\/em> = <strong>trælkvinde<\/strong> i udkastene (22×), men DFB's 1 Mos 16 kalder Hagar »tjenestepige«, og <em>ʔāmāh<\/em> er »slav     && (!q || fold([e.id, e.source, typeof e.value === "string" ? e.value : JSON.stringify(e.value), e.note, (e.words || []).join(" "), e.refs.join(" "), (e.glosses || []).join(" ")].join(" ")).includes(q)));
  $("#main").innerHTML = NOTICE + `<h1>Store</h1><p>The working facts the agents use (checked against the corpus, not by the team unless marked “team”): features and letter rules (observations), terms, formulas and names
    (decisions), and gaps. A change is a new entry that replaces the old one; both are kept.</p>
    <div class="filters"><select id="kind"><option value="">all kinds</option>${kinds.map(k => `<option ${k === kind ? "selected" : ""}>${esc(k)}</option>`).join("")}</select>
    <label><input type="checkbox" id="dead" ${showDead ? "checked" : ""}> show replaced entries</label></div>
    <div class="count">${rows.length} entries${q ? ` matching “${esc($("#q").value)}”` : ""}</div>`
    + rows.slice(0, 400).map(entryHtml).join("") + (rows.length > 400 ? `<p class="count">first 400 shown; narrow the search</p>` : "");
  $("#kind").onchange = ev => { kind = ev.target.value; showStore(); };
  $("#dead").onchange = ev => { showDead = ev.target.checked; showStore(); };
}
function showQuestions() {
  $("#main").innerHTML = `<h1>Open questions</h1><p>Questions the agents could not settle from the texts. Answer on the page, under the question.</p>`
    + DATA.questions.map(q => `<h3><a href="#${q.page}" onclick="tab='pages'">${esc(q.title)}</a></h3>${q.html}`).join("");
}
function search() {
  const raw = $("#q").value.trim(), q = fold(raw);
  if (tab === "store") return showStore();
  if (!q) return tab === "pages" ? showPage() : showQuestions();
  const hits = DATA.pages.map(p => { const t = fold(p.text), i = t.indexOf(q); return i < 0 ? null : {p, i, n: t.split(q).length - 1}; })
    .filter(Boolean).sort((a, b) => b.n - a.n);
  const st = DATA.store.filter(e => e.live && fold([e.id, e.source, e.value, e.note, (e.words || []).join(" ")].join(" ")).includes(q));
  $("#main").innerHTML = `<h1>Search: ${esc(raw)}</h1><div class="hits">` + hits.map(h => {
    const s = h.p.text.slice(Math.max(0, h.i - 90), h.i + q.length + 140);
    return `<div class="hit"><a href="#${h.p.id}" onclick="$('#q').value=''">${esc(h.p.title)}</a> <span class="count">(${h.n})</span><div class="snip">…${esc(s)}…</div></div>`;
  }).join("") + `</div>` + (st.length ? `<h2>Store (${st.length})</h2>` + st.slice(0, 60).map(entryHtml).join("") : "")
    + (!hits.length && !st.length ? `<p>Nothing found.</p>` : "");
}
function go() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  side();
  if ($("#q").value.trim()) return search();
  tab === "pages" ? showPage() : tab === "store" ? showStore() : showQuestions();
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; go(); });
let t; $("#q").oninput = () => { clearTimeout(t); t = setTimeout(go, 150); };
window.onhashchange = () => { const h = decodeURIComponent(location.hash.slice(1)); if (DATA.pages.some(p => p.id === h)) { page = h; tab = "pages"; $("#q").value = ""; go(); } };
const h0 = decodeURIComponent(location.hash.slice(1));
if (DATA.pages.some(p => p.id === h0)) page = h0; else if (["store", "questions"].includes(h0)) tab = h0;
else if (h0.startsWith("search=")) { tab = "pages"; $("#q").value = h0.slice(7); }
$("#credits").innerHTML = DATA.credits || "";
go();
</script>
</body>
</html>
