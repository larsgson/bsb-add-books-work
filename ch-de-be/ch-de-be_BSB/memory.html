>Härde oder Herde.<\/strong> Das Korpus hat nur »Härde«, die Entwürfe beide. Gilt »Härde«?<\/li><li><strong>Meitli oder Meitschi.<\/strong> Korpus 18 : 1 für Meitschi; die Genesis-Entwürfe haben »Meitli«.<\/li><li><strong>Zahlwörter<\/strong> vor »achtzg«: »zwöiachtzg« oder »zwöienachtzg« (Gen 5)?<\/li><li><strong>Der Gottesname.<\/strong> »der HERR« ist entschieden; trägt die Grossschreibung beim Vorlesen? Braucht es eine Fussnote beim ersten Vorkommen?<\/li><li><strong>Pronomen 3. Sg. f. im Dativ:<\/strong> »ire« (betont) neben »nere/ere« – ist »ire« als betonte Form richtig? Das Korpus belegt sie kaum.<\/li><li><strong>Verdopplung »la … la« und »ga … ga«:<\/strong> Wie weit soll ein Agent sie aktiv einsetzen (das Korpus hat 46 bzw. 35 Belege)?<\/li><li>Die offenen Wörter der Übersichten: Süüle oder Gedänkstei; Zouberer; Gröiel; sech kümmere oder heisueche; Gäld oder Silber; Efrat oder Efrata; der fein Duft als Opferformel; Lychnam.<\/li><li><strong>חֶסֶד: »Tröiji« oder »Erbarme«?<\/strong> Entschieden ist »Tröiji« (term:H2617, Rut A 2). Das Korpus gibt ἔλεος, die LXX-Entsprechung von חֶסֶד, fast immer mit »Erbarme« wieder (62×, z. B. 1PE 1:3; »häb Erbarme«, MAT 15:22); »Tröiji« steht dort nur 5× und für πίστις (›Treue‹, MAT 23:23, ROM 3:3). Bleibt »Tröiji« für die Bundestreue (Rut, Psalmen), und »Erbarme« dort, wo חֶסֶד Gnade meint?<\/li><li><strong>›Amen, ich sage euch‹.<\/strong> Entschieden ist »Würklech, würklech, i cha nech säge:« für Joh (formula:amen_amen), und »Lueget« soll für ἰδού reserviert sein (term:H2009). Das Korpus sagt in Joh und Mt »Lueget, i cha nech säge« (43×, auch JHN 1:51 für ἀμὴν ἀμήν), Singular »Lue, i cha der säge« (5×, JHN 3:3), in Lk »Würklech, i säge nech« (5×, LUK 12:44); »Würklech, würklech« 0×. Gilt der Projektentscheid, oder folgen die Entwürfe Bietenhards »Lueget, …«?<\/li><\/ol>\n<h2>Store entries<\/h2>\n<div class=\"store-block\"><div class=\"store-label\">Store entries (generated from profile/)<\/div>\n<p>_(no store entries on this page)_<\/p>\n<\/div>", "text": "# Fragen an das Sprachteam Was die Belege nicht entscheiden. Antworten bitte direkt hier eintragen (`> **Korrektur (Name, Datum):** …`); der nächste Agent überträgt sie in den Store. 1. **Historisches Präsens.** Das Korpus erzählt im Perfekt, wechselt aber bei Redeeinleitungen ins Präsens (»seit ne«, besonders in Joh). Wie viel davon ist in AT-Erzählungen natürlich? 2. **»als« oder »weder« nach dem Komparativ.** Das Korpus hat meist »als«, die Entwürfe oft »weder«. Ist »weder« für heutige Berner Leser natürlicher? 3. **Wortstellung im Nebensatz.** »wo dihr ghört heit« (häufiger im Korpus) oder »wo dihr heit ghört« (mündlicher)? Soll ein Agent eine Form bevorzugen? 4. **Historische Druckformen in Mt/Mk.** Sind »Vater«, »Himmel«, »Christus« dort bewusst (andere Auflage) oder Versehen? Wir schreiben überall Vatter, Himel, Chrischtus. 5. **Härde oder Herde.** Das Korpus hat nur »Härde«, die Entwürfe beide. Gilt »Härde«? 6. **Meitli oder Meitschi.** Korpus 18 : 1 für Meitschi; die Genesis-Entwürfe haben »Meitli«. 7. **Zahlwörter** vor »achtzg«: »zwöiachtzg« oder »zwöienachtzg« (Gen 5)? 8. **Der Gottesname.** »der HERR« ist entschieden; trägt die Grossschreibung beim Vorlesen? Braucht es eine Fussnote beim ersten Vorkommen? 9. **Pronomen 3. Sg. f. im Dativ:** »ire« (betont) neben »nere/ere« – ist »ire« als betonte Form richtig? Das Korpus belegt sie kaum. 10. **Verdopplung »la … la« und »ga … ga«:** Wie weit soll ein Agent sie aktiv einsetzen (das Korpus hat 46 bzw. 35 Belege)? 11. Die offenen Wörter der Übersichten: Süüle oder Gedänkstei; Zouberer; Gröiel; sech kümmere oder heisueche; Gäld oder Silber; Efrat oder Efrata; der fein Duft als Opferformel; Lychnam. 12. **חֶסֶד: »Tröiji« oder »Erbarme«?** Entschieden ist »Tröiji« (term:H2617, Rut A 2). Das Korpus gibt ἔλεος, die LXX-Entsprechung von חֶסֶד, fast immer mit »Erbarme« wieder (62×, z. B. 1PE 1:3; »häb Erbarme«, MAT 15:22); »Tröiji« steht dort nur 5× und für πίστις (›Treue‹, MAT 23:23, ROM 3:3). Bleibt »Tröiji« für die Bundestreue (Rut, Psalmen), und »Erbarme« dort, wo חֶסֶד Gnade meint? 13. **›Amen, ich sage euch‹.** Entschieden ist »Würklech, würklech, i cha nech säge:« für Joh (formula:amen_amen), und »Lueget« soll für ἰδού reserviert sein (term:H2009). Das Korpus sagt in Joh und Mt »Lueget, i cha nech säge« (43×, auch JHN 1:51 für ἀμὴν ἀμήν), Singular »Lue, i cha der säge« (5×, JHN 3:3), in Lk »Würklech, i säge nech« (5×, LUK 12:44); »Würklech, würklech« 0×. Gilt der Projektentscheid, oder folgen die Entwürfe Bietenhards »Lueget, …«? ## Store entries <!-- store:begin (generated by scripts/wiki.py sync from profile/; change the store, not this block) --> _(no store entries on this page)_ <!-- store:end sha=4279823f --> "}, {"id": "grammar/artikel-kasus-besitz.md", "title": "Artikel, Kasus, Besitz", "html": "<h1>Artikel, Kasus, Besitz<\/h1>\n<h2>Der Artikel<\/h2>\n<div class=\"table-wrap\"><table><tr><th><\/th><th>m.<\/th><th>f.<\/th><th>n.<\/th><th>Pl.<\/th><\/tr><tr><td>Nom./Akk.<\/td><td>der<\/td><td>d (di + Adj.)<\/td><td>ds<\/td><td>d (di + Adj.)<\/td><\/tr><tr><td>Dativ<\/td><td>em<\/td><td>der<\/td><td>em<\/td><td>de (den vor Vokal)<\/td><\/tr><tr><td>unbestimmt<\/td><td>e (en vor Vokal)<\/td><td>e<\/td><td>es<\/td><td>–<\/td><\/tr><tr><td>unbest. Dativ<\/td><td>emene / mene<\/td><td>nere<\/td><td>emene / mene<\/td><td>–<\/td><\/tr><\/table><\/div>\n<ul><li>»d« steht direkt vor dem Nomen, »di«, wenn ein Adjektiv folgt: »di gueti Botschaft« (1CO 1:17). Zählung: »di« + Kleinwort 718×, »d« + Kleinwort 16× (und diese 16 sind das Klitikon »d« = du).<\/li><li>Dativ Plural vor Vokal mit n: »i den Ouge« (1CO 1:26; »den« 203×).<\/li><li>Dativ unbestimmt: »vo mene Maa«, »zu nere …«.<\/li><\/ul>\n<h2>Kasus<\/h2>\n<p>Es gibt keinen Genitiv und keinen eigenen Akkusativ; der Dativ ist an Artikel und Pronomen sichtbar. »gät em Cheiser« (1PE 2:17). Ein Genitiv steht nur in festen Fügungen: »Gottes Rych« (100×), seltener »Gottes Geischt«, »Gottes Wille«. Sonst gilt »vo Gott« (385×).<\/p>\n<h2>Besitz<\/h2>\n<ol><li><strong>»vo« + Dativ<\/strong> ist der Normalfall (Muster »ds Huus vo sym Vatter«), »der Maa vo der Noomi« (Entwurf Rut 1,3). vom 1025×, vo der 328×, vo de 405×.<\/li><li><strong>Possessiver Dativ<\/strong>: »em Herr sym Bächer« (1CO 10:21), »em Cheiser sy Ehr« (1PE 2:17); 35×. Gut für Personen, sparsam einsetzen.<\/li><li><strong>s-Genitiv<\/strong> nur »Gottes …« in festen Wendungen. Kein »Davids Sohn«, sondern »der Suhn vom David«.<\/li><\/ol>\n<h2>Personennamen mit Artikel<\/h2>\n<p>Namen tragen den Artikel: »der Petrus« (rund 130 von 165), »der Paulus«, »der Josef« (ACT 7:14), »d Maria«, »em Mose«. <strong>Jesus<\/strong> steht fast immer ohne Artikel (14 von 973, meist im Mund anderer: »der Jesus vo Nazaret«). Die Entwürfe: der Boas, d Rut, d Noomi, der Elimelech; Gott und der HERR ohne Zusatz.<\/p>\n<h2>Adjektive<\/h2>\n<ul><li>f./Pl. Nom./Akk. auf -i: »di gueti …«, »alli«, »iri eigeti …« (1CO 1:21);<\/li><li>Dativ und nach bestimmtem Artikel m.: -e: »vo der gägewärtige Zyt« (1CO 2:6);<\/li><li>prädikativ unflektiert: »isch guet«.<\/li><\/ul>\n<h2>Plural und Zahlwort<\/h2>\n<p>Plural oft mit Umlaut oder ohne Endung: Suhn – Sühn, Brueder – Brüeder, Boum – Böim, Maa – Manne. Frauenbezeichnungen auf -ere: Töchtere, Schwigertöchtere (Entwurf Rut 1,6), Moabitere. ›zwei‹ nach Genus: »zwee« (m.), »zwo« (f.), »zwöi« (n.) – »syni zwee Sühn« (Entwurf Rut 1,1).<\/p>\n<p>Nach »wi« und »i« (in) wird der unbestimmte Artikel zu »ne«: »wi ne Löi« (1PE 5:8; »wi e« 0×), »i ne Stadt« (LUK 1:39); nach »für« beides.<\/p>\n<p>›drei‹: »drü« beim Neutrum (»drü Zält«, LUK 9:33; »drü Määs«, LUK 13:21), »drei« bei m. und f. (»drei Manne«, ACT 10:19; »drei Stund«). Zehner auf -zg: zwänzg, dryssg, vierzg, füfzg.<\/p>\n<h2>Store entries<\/h2>\n<div class=\"store-block\"><div class=\"store-label\">Store entries (generated from profile/)<\/div>\n<ul><li><strong><code>article<\/code><\/strong> <strong>Bestimmter Artikel: »d n<p>Das Relativwort ist <strong>unveränderlich »wo«<\/strong> (», wo« 2430×, », won« vor Vokal 347×). »welch-« kommt nicht vor, »der/die/das« als Relativpronomen nur ausnahmsweise.<\/p>\n<ul><li>Ohne Bezugsnomen steht das Demonstrativ: »dä, wo …« (214×), »die, wo …« (215×), »das, wo …« (79×). Beispiel: »Dä, wo pflanzet« (1CO 3:8).<\/li><li>Eine Präposition geht an das Demonstrativ: »mit däm, wo …«, »vo dene, wo …« (103×).<\/li><li>Ist das Bezugswort im Relativsatz Dativ oder Präpositionalobjekt, wird es im Satz wieder aufgenommen: »wo ne Gott drinne beruefe het« (1CO 7:24), »wo mir Gott dermit danke« (1CO 10:16), »wo mer ne drum …« (1JN 5:15). Keine Formen wie »in dem«, »mit welchem«.<\/li><\/ul>\n<h2>Verbalkomplex<\/h2>\n<p>Das finite Hilfsverb steht <strong>vor<\/strong> Modalverb und Infinitiv: »het müesse lyde« (1PE 3:18), »hei mer nüüt chönne verschnuufe« (2CO 7:5). Rund 196 Belege, die hochdeutsche Folge (»lyde müesse het«) kein einziges Mal. Ersatzinfinitiv auch bei ga: »het dörfe ga sitze« (HEB 12:2).<\/p>\n<p>Im Nebensatz steht das Partizip meist vor dem Hilfsverb (Muster »wo dihr ghört heit«, rund 312×), daneben die mündlichere Folge Hilfsverb – Partizip (»wo dihr heit ghört«, 1JN 2:7; rund 80×). Beides geht.<\/p>\n<h2>Infinitive<\/h2>\n<ul><li><strong>Zweck:<\/strong> »für (…) z + Infinitiv« (247×; »um … zu« 1×): »für di gueti Botschaft z predige« (1CO 1:17). Mit Nebensatz: »für dass …« (238×; »damit« 0×).<\/li><li>Trennbare Verben nehmen z in die Mitte: »heizga«, »yzsta«, »wyterzgä«; Entwurf Rut 1,6 »heizga«.<\/li><li><strong>Bewegung:<\/strong> »ga« + Infinitiv (»sy ne ga begrabe«, ACT 5:6), »cho« + Infinitiv (»isch mi cho bsueche«, ACT 22:13). »go« gibt es im Korpus nicht.<\/li><li><strong>Beginnen:<\/strong> »aafa« + blosser Infinitiv (»aafa rede«, 2PE 2:16; 76×), Entwurf Rut 1,9 »lut aafa briegge«.<\/li><li><strong>Verdopplung:<\/strong> »lö nech la grüesse« (1CO 16:20), »la di nid la scheide« (1CO 7:27), »gange ga bringe« (2CO 8:19).<\/li><\/ul>\n<h2>Verbformen<\/h2>\n<p>Infinitiv auf -e (mache, säge; vor Vokal -en). Kurzverben: ga, cho, gseh, ha, sy, tue, gä, la, sta, nä. Partizipien: gsi, gha, ggä, gno, cho, ggange, gseh, gseit, ta. Vor b und g wird das Präfix zur Verdopplung (»bbätte«, »bblibe«, »ggange«), vor p, t, k, ch fällt es weg (»touft«, »prediget«, »cho«, »bracht«).<\/p>\n<h2>Wortstellung<\/h2>\n<p>Verbzweit im Hauptsatz, auch nach »Da«, »Du« oder »Jitz« (»Da isch der …«, ACT 2:14); Partizip und Infinitiv stehen am Ende. Im Nebensatz steht beim <strong>Modalverb<\/strong> die Folge Modalverb – Infinitiv (»dass mir chönne begryffe«, 1CO 2:12; 118 : 5), beim Partizip dagegen meist Partizip – Hilfsverb.<\/p>\n<p>Modalverben und »aafa« haben kein Partizip: »hei aafa … rede« (ACT 2:4), nicht »aagfange z rede«; »gwellt«, »gmüesst«, »gchönnt« kommen nicht vor.<\/p>\n<h2>Präsensendungen<\/h2>\n<p>du -sch (»seisch«, »bisch«), er -t (»seit«), dihr -et/-t (»säget«, »heit«, »syt«); mir und si wie der Infinitiv (»mir säge«). Imperativ Singular ist der Stamm (»chumm«, »gib«, »lue«), Plural -et (»lueget«, »loset«).<\/p>\n<h2>Store entries<\/h2>\n<div class=\"store-block\"><div class=\"store-label\">Store entries (generated from profile/)<\/div>\n<ul><li><strong><code>relative_clause<\/code><\/strong> <strong>Relativsätze mit unveränderlichem »wo« (», wo« 2430×, », won« 347×); »welch-« 0×. Vor einem Relativsatz ohne Nomen steht das Demonstrativ: »dä, wo« 214×, »die, wo« 215×, »das, wo« 79×. Präpositionen gehen an das Demonstrativ: »mit däm, wo« (103×).<\/strong> [high, observed] — <code>&lt;Nomen&gt;, wo … | dä/die/das, wo … | &lt;Präposition&gt; däm/dere/dene, wo …<\/code><ul><li>NT: 1CO 2:2 <em>dä, wo<\/em>; 1CO 4:19 <em>bi dene, wo<\/em>; GEN 24:2 <em>Huus, wo<\/em><\/li><li>Für ein Dativ- oder Präpositionalobjekt im Relativsatz nimmt der Satz ein Pronomen oder Pronominaladverb wieder auf: »wo … drinne«, »wo … dermit«, »wo mer ne drum …« (1CO 7:24, 1CO 10:16, 1JN 5:15).<\/li><li>agent:memory-setup, 2026-10-14<\/ ga« + Infinitiv (»sy ne ga begrabe«, ACT 5:6), »cho« + Infinitiv (»isch mi cho bsueche«, ACT 22:13). »go« gibt es im Korpus nicht. - **Beginnen:** »aafa« + blosser Infinitiv (»aafa rede«, 2PE 2:16; 76×), Entwurf Rut 1,9 »lut aafa briegge«. - **Verdopplung:** »lö nech la grüesse« (1CO 16:20), »la di nid la scheide« (1CO 7:27), »gange ga bringe« (2CO 8:19). ## Verbformen Infinitiv auf -e (mache, säge; vor Vokal -en). Kurzverben: ga, cho, gseh, ha, sy, tue, gä, la, sta, nä. Partizipien: gsi, gha, ggä, gno, cho, ggange, gseh, gseit, ta. Vor b und g wird das Präfix zur Verdopplung (»bbätte«, »bblibe«, »ggange«), vor p, t, k, ch fällt es weg (»touft«, »prediget«, »cho«, »bracht«). ## Wortstellung Verbzweit im Hauptsatz, auch nach »Da«, »Du« oder »Jitz« (»Da isch der …«, ACT 2:14); Partizip und Infinitiv stehen am Ende. Im Nebensatz steht beim **Modalverb** die Folge Modalverb – Infinitiv (»dass mir chönne begryffe«, 1CO 2:12; 118 : 5), beim Partizip dagegen meist Partizip – Hilfsverb. Modalverben und »aafa« haben kein Partizip: »hei aafa … rede« (ACT 2:4), nicht »aagfange z rede«; »gwellt«, »gmüesst«, »gchönnt« kommen nicht vor. ## Präsensendungen du -sch (»seisch«, »bisch«), er -t (»seit«), dihr -et/-t (»säget«, »heit«, »syt«); mir und si wie der Infinitiv (»mir säge«). Imperativ Singular ist der Stamm (»chumm«, »gib«, »lue«), Plural -et (»lueget«, »loset«). ## Store entries <!-- store:begin (generated by scripts/wiki.py sync from profile/; change the store, not this block) --> - **`relative_clause`** **Relativsätze mit unveränderlichem »wo« (», wo« 2430×, », won« 347×); »welch-« 0×. Vor einem Relativsatz ohne Nomen steht das Demonstrativ: »dä, wo« 214×, »die, wo« 215×, »das, wo« 79×. Präpositionen gehen an das Demonstrativ: »mit däm, wo« (103×).** [high, observed] — `<Nomen>, wo … | dä/die/das, wo … | <Präposition> däm/dere/dene, wo …` - NT: 1CO 2:2 *dä, wo*; 1CO 4:19 *bi dene, wo*; GEN 24:2 *Huus, wo* - Für ein Dativ- oder Präpositionalobjekt im Relativsatz nimmt der S .md", "title": "Fragen an das Sprachteam", "html": "<p><strong>»als« oder »weder« nach dem Komparativ.<\/strong> Das Korpus hat meist »als«, die Entwürfe oft »weder«. Ist »weder« für heutige Berner Leser natürlicher?<\/p>"}, {"page": "fragen.md", "title": "Fragen an das Sprachteam", "html": "<p><strong>Wortstellung im Nebensatz.<\/strong> »wo dihr ghört heit« (häufiger im Korpus) oder »wo dihr heit ghört« (mündlicher)? Soll ein Agent eine Form bevorzugen?<\/p>"}, {"page": "fragen.md", "title": "Fragen an das Sprachteam", "html": "<p><strong>Historische Druckformen in Mt/Mk.<\/strong> Sind »Vater«, »Himmel«, »Christus« dort bewusst (andere Auflage) oder Versehen? Wir schreiben überall Vatter, Himel, Chrischtus.<\/p>"}, {"page": "fragen.md", "title": "Fragen an das Sprachteam", "html": "<p><strong>Härde oder Herde.<\/strong> Das Korpus hat nur »Härde«, die Entwürfe beide. Gilt »Härde«?<\/p>"}, {"page": "fragen.md", "title": "Fragen an das Sprachteam", "html": "<p><strong>Meitli oder Meitschi.<\/strong> Korpus 18 : 1 für Meitschi; die Genesis-Entwürfe haben »Meitli«.<\/p>"}, {"page": "fragen.md", "title": "Fragen an das Sprachteam", "html": "<p><strong>Zahlwörter<\/strong> vor »achtzg«: »zwöiachtzg« oder »zwöienachtzg« (Gen 5)?<\/p>"}, {"page": "fragen.md", "title": "Fragen an das Sprachteam", "html": "<p><strong>Der Gottesname.<\/strong> »der HERR« ist entschieden; trägt die Grossschreibung beim Vorlesen? Braucht es eine Fussnote beim ersten Vorkommen?<\/p>"}, {"page": "fragen.md", "title": "Fragen an das Sprachteam", "html": "<p><strong>Pronomen 3. Sg. f. im Dativ:<\/strong> »ire« (betont) neben »nere/ere« – ist »ire« als betonte Form richtig? Das Korpus belegt sie kaum.<\/p>"}, {"page": "fragen.md", "title": "Fragen an das Sprachteam", "html": "<p><strong>Verdopplung »la … la« und »ga … ga«:<\/strong> Wie weit soll ein Agent sie aktiv einsetzen (das Korpus hat 46 bzw. 35 Belege)?<\/p>"}, {"page": "fragen.md", "title": "Fragen an das Sprachteam", "html": "<p>Die offenen Wörter der Übersichten: Süüle oder Gedänkstei; Zouberer; Gröiel; sech kümmere oder heisueche; Gäld oder Silber; Efrat oder Efrata; der fein Duft als Opferformel; Lychnam.<\/p>"}, {"page": "fragen.md", "title": "Fragen an das Sprachteam", "html": "<p><strong>חֶסֶד: »Tröiji« oder »Erbarme«?<\/strong> Entschieden ist »Tröiji« (term:H2617, Rut A 2). Das Korpus gibt ἔλεος, die LXX-Entsprechung von חֶסֶד, fast immer mit »Erbarme« wieder (62×, z. B. 1PE 1:3; »häb Erbarme«, MAT 15:22); »Tröiji« steht dort nur 5× und für πίστις (›Treue‹, MAT 23:23, ROM 3:3). Bleibt »Tröiji« für die Bundestreue (Rut, Psalmen), und »Erbarme« dort, wo חֶסֶד Gnade meint?<\/p>"}, {"page": "fragen.md", "title": "Fragen an das Sprachteam", "html": "<p><strong>›Amen, ich sage euch‹.<\/strong> Entschieden ist »Würklech, würklech, i cha nech säge:« für Joh (formula:amen_amen), und »Lueget« soll für ἰδού reserviert sein (term:H2009). Das Korpus sagt in Joh und Mt »Lueget, i cha nech säge« (43×, auch JHN 1:51 für ἀμὴν ἀμήν), Singular »Lue, i cha der säge« (5×, JHN 3:3), in Lk »Würklech, i säge nech« (5×, LUK 12:44); »Würklech, würklech« 0×. Gilt der Projektentscheid, oder folgen die Entwürfe Bietenhards »Lueget, …«?<\/p>"}], "credits": "<h1>Credits<\/h1>\n<p>Our work in this folder (drafts, notes, the wiki's prose, the language store, statistics) is dedicated to the public domain (CC0 1.0). We learned from and quote the editions below (docs/licensing.md).<\/p>\n<p>Quoted in short passages, with references, under the quotation right and the edition's own terms; <strong>these quotations are not covered by CC0<\/strong> and stay with their owners:<\/p>\n<ul><li>Hans und Ruth Bietenhard, Ds Nöie Teschtamänt bärndütsch, © Berchtold Haller Verlag, Bern 1984<\/li><\/ul>", "notice": "Arbeitsanalyse von KI-Agenten, aus der vorhandenen Übersetzung gelernt: Annahmen für die Entwürfe, nicht vom Sprachteam (Bern German) geprüft. Nur Einträge mit „team“ stammen vom Team."};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fold = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ᷀-᷿꞉]/g, "").toLowerCase();
let tab = "pages", page = "index.md";
const NOTICE = `<div class="notice" role="note">${esc(DATA.notice)}</div>`;
const HELP = `<div class="help">This is a read-only copy, built by <code>python3 scripts/wiki.py view ${esc(DATA.project)}</code>.
To add what you know, edit the page's <code>.md</code> file in <code>wiki/</code>, or send the text to whoever keeps it.
To correct a fact, write under it: <code>&gt; **Correction (your name, date):** …</code>. The next agent turns it into a store entry.
The grey "Store entries" boxes are generated from the store; don't edit them by hand.</div>`;

function side() {
  if (tab !== "pages") { $("#side").innerHTML = sideCounts(); return; }
  const g = {top: [], grammar: [], end: []};
  DATA.pages.forEach(p => (p.id.startsWith("grammar/") ? g.grammar : ["inbox.md", "log.md"].includes(p.id) ? g.end : g.top).push(p));
  const n = id => DATA.store.filter(e => e.live && e.page === id).length;
  const link = p => `<a href="#${p.id}" class="${p.id === page ? "on" : ""}">${esc(p.title)}${n(p.id) ? `<span class="n">${n(p.id)}</span>` : ""}</a>`;
  $("#side").innerHTML = g.top.map(link).join("") + `<div class="grp">Grammar</div>` + g.grammar.map(link).join("")
    + `<div class="grp">Upkeep</div>` + g.end.map(link).join("");
}
function sideCounts() {
  const live = DATA.store.filter(e => e.live), c = {};
  live.forEach(e => c[e.kind] = (c[e.kind] || 0) + 1);
  return `<div class="grp">Store</div>` + Object.entries(c).sort((a, b) => b[1] - a[1])
    .map(([k, v]) => `<a href="javascript:void(0)" onclick="kindFilter('${k}')">${esc(k)}<span class="n">${v}</span></a>`).join("")
    + `<div class="grp">Totals</div><a>live<span class="n">${live.length}</span></a><a>superseded<span class="n">${DATA.store.length - live.length}</span></a>`;
}
function showPage() {
  const p = DATA.pages.find(p => p.id === page) || DATA.pages[0];
  $("#main").innerHTML = NOTICE + (p.id === "index.md" ? HELP : "") + p.html;
  window.scrollTo(0, 0);
}
function entryHtml(e) {
  const v = typeof e.value === "string" ? e.value : JSON.stringify(e.value);
  const by = DATA.store.filter(x => x.supersedes === e.id).map(x => x.id);
  return `<div class="entry ${e.live ? "" : "dead"}"><div class="top"><span class="tag kind">${esc(e.kind)}</span>
    ${e.source ? `<span>${esc(e.source)} →</span>` : ""}<span class="val">${esc(v)}</span>
    ${e.team ? `<span class="tag team">team</span>` : `<span class="tag unrev">not reviewed</span>`}
    ${[e.confidence, e.status, e.attested, e.live ? "" : "superseded"].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join("")}
    <span class="id">${esc(e.id)}</span></div>
    ${e.glosses?.length ? `<div class="meta">gloss: ${e.glosses.map(g => esc(g)).join("<br>")}</div>` : ""}
    ${e.pattern ? `<div class="meta">pattern: <code>${esc(e.pattern)}</code></div>` : ""}
    ${e.note ? `<div class="note">${esc(e.note)}</div>` : ""}
    ${e.refs?.length ? `<div class="meta">evidence: ${esc(e.refs.slice(0, 8).join("; "))}${e.refs.length > 8 ? " …" : ""}</div>` : ""}
    ${e.words?.length ? `<div class="meta">answers the search for: ${esc(e.words.join(", "))}</div>` : ""}
    <div class="meta">${esc(e.by)}, ${esc(e.date)}${e.method ? `, ${esc(e.method)}` : ""}${e.supersedes ? `, replaces <code>${esc(e.supersedes)}</code>` : ""}
    ${by.length ? `, replaced by <code>${esc(by.join(", "))}</code>` : ""}${e.page ? ` · page <a href="#${e.page}" onclick="tab='pages'">${esc(e.page)}</a>` : ""}</div></div>`;
}
let kind = "", showDead = false;
function kindFilter(k) { kind = k; showStore(); }
function showStore() {
  const q = fold($("#q").value.trim());
  const kinds = [...new Set(DATA.store.map(e => e.kind))].sort();
  const rows = DATA.store.filter(e => (showDead || e.live) && (!kind || e.kind === kind)
    && (!q || fold([e.id, e.source, typeof e.value === "string" ? e.value : JSON.stringify(e.value), e.note, (e.words || []).join(" "), e.refs.join(" "), (e.glosses || []).join(" ")].join(" ")).includes(q)));
  $("#main").innerHTML = NOTICE + `<h1>Store</h1><p>The working facts the agents use (checked against the corpus, not by the team unless marked “team”): features and letter rules (observations), terms, formulas and names
    (decisions), and gaps. A change is a new entry that replaces the old one; both are kept.</p>
    <div class="filters"><select id="kind"><option value="">all kinds</option>${kinds.map(k => `<option ${k === kind ? "selected" : ""}>${esc(k)}</option>`).join("")}</select>
    <label><input type="checkbox" id="dead" ${showDead ? "checked" : ""}> show replaced entries</label></div>
    <div class="count">${rows.length} entries${q ? ` matching “${esc($("#q").value)}”` : ""}</div>`
    + rows.slice(0, 400).map(entryHtml).join("") + (rows.length > 400 ? `<p class="count">first 400 shown; narrow the search</p>` : "");
  $("#kind").onchange = ev => { kind = ev.target.value; showStore(); };
  $("#dead").onchange = ev => { showDead = ev.target.checked; showStore(); };
}
function showQuestions() {
  $("#main").innerHTML = `<h1>Open questions</h1><p>Questions the agents could not settle from the texts. Answer on the page, under the question.</p>`
    + DATA.questions.map(q => `<h3><a href="#${q.page}" onclick="tab='pages'">${esc(q.title)}</a></h3>${q.html}`).join("");
}
function search() {
  const raw = $("#q").value.trim(), q = fold(raw);
  if (tab === "store") return showStore();
  if (!q) return tab === "pages" ? showPage() : showQuestions();
  const hits = DATA.pages.map(p => { const t = fold(p.text), i = t.indexOf(q); return i < 0 ? null : {p, i, n: t.split(q).length - 1}; })
    .filter(Boolean).sort((a, b) => b.n - a.n);
  const st = DATA.store.filter(e => e.live && fold([e.id, e.source, e.value, e.note, (e.words || []).join(" ")].join(" ")).includes(q));
  $("#main").innerHTML = `<h1>Search: ${esc(raw)}</h1><div class="hits">` + hits.map(h => {
    const s = h.p.text.slice(Math.max(0, h.i - 90), h.i + q.length + 140);
    return `<div class="hit"><a href="#${h.p.id}" onclick="$('#q').value=''">${esc(h.p.title)}</a> <span class="count">(${h.n})</span><div class="snip">…${esc(s)}…</div></div>`;
  }).join("") + `</div>` + (st.length ? `<h2>Store (${st.length})</h2>` + st.slice(0, 60).map(entryHtml).join("") : "")
    + (!hits.length && !st.length ? `<p>Nothing found.</p>` : "");
}
function go() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  side();
  if ($("#q").value.trim()) return search();
  tab === "pages" ? showPage() : tab === "store" ? showStore() : showQuestions();
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; go(); });
let t; $("#q").oninput = () => { clearTimeout(t); t = setTimeout(go, 150); };
window.onhashchange = () => { const h = decodeURIComponent(location.hash.slice(1)); if (DATA.pages.some(p => p.id === h)) { page = h; tab = "pages"; $("#q").value = ""; go(); } };
const h0 = decodeURIComponent(location.hash.slice(1));
if (DATA.pages.some(p => p.id === h0)) page = h0; else if (["store", "questions"].includes(h0)) tab = h0;
else if (h0.startsWith("search=")) { tab = "pages"; $("#q").value = h0.slice(7); }
$("#credits").innerHTML = DATA.credits || "";
go();
</script>
